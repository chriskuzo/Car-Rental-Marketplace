<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driver Hub</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body class="driver-page">
  <main class="driver-shell">
    <section class="driver-top" aria-label="Driver overview">
      <header class="driver-welcome">
        <div>
          <h1>Welcome Back</h1>
          <p>Chris Ikuzo</p>
        </div>
        <div class="driver-avatar" aria-label="Driver profile">CI</div>
      </header>

      <div class="driver-metrics" aria-label="Driver statistics">
        <article class="driver-metric-card">
          <p class="metric-value"><i class="fa-solid fa-star" aria-hidden="true"></i> 4.5</p>
          <p class="metric-label">Rating</p>
        </article>

        <article class="driver-metric-card">
          <p class="metric-value"><i class="fa-solid fa-money-bill-wave" aria-hidden="true"></i> Rwf 350K</p>
          <p class="metric-label">This Month</p>
        </article>

        <article class="driver-metric-card">
          <p class="metric-value"><i class="fa-solid fa-briefcase" aria-hidden="true"></i> 10</p>
          <p class="metric-label">Years of Exp</p>
        </article>
      </div>
    </section>

    <section class="driver-requests" aria-label="Job requests">
      <header class="requests-head">
        <h2>Job Requests</h2>
        <span>2 new</span>
      </header>

      <div class="request-list">
      <article class="request-card">
        <div class="request-meta">
          <h3>Jane Doe</h3>
          <p class="request-car">Toyota Rav4</p>
          <p class="request-detail"><i class="fa-solid fa-location-dot" aria-hidden="true"></i> Kigali Airport</p>
          <p class="request-detail"><i class="fa-regular fa-clock" aria-hidden="true"></i> 12:00PM / 3 days</p>
          <p class="request-detail"><i class="fa-solid fa-money-bill-wave" aria-hidden="true"></i> RwF 75,000</p>
        </div>

        <div class="request-image" aria-label="Requested car image">CAR</div>

        <div class="request-side">
          <button class="status-pill" type="button">Status</button>
        </div>

        <div class="request-actions">
          <button class="decline" type="button">Decline</button>
          <button class="accept" type="button">Accept</button>
        </div>
      </article>

      <article class="request-card">
        <div class="request-meta">
          <h3>John Mutoni</h3>
          <p class="request-car">Hyundai Tucson</p>
          <p class="request-detail"><i class="fa-solid fa-location-dot" aria-hidden="true"></i> Nyabugogo Bus Park</p>
          <p class="request-detail"><i class="fa-regular fa-clock" aria-hidden="true"></i> 3:00PM / 1 day</p>
          <p class="request-detail"><i class="fa-solid fa-money-bill-wave" aria-hidden="true"></i> RwF 40,000</p>
        </div>

        <div class="request-image" aria-label="Requested car image">CAR</div>

        <div class="request-side">
          <button class="status-pill" type="button">Status</button>
        </div>

        <div class="request-actions">
          <button class="decline" type="button">Decline</button>
          <button class="accept" type="button">Accept</button>
        </div>
      </article>
      </div>
    </section>

    <nav class="bottom-nav" aria-label="Primary">
      <a href="index.html" aria-label="Home"><i class="fa-solid fa-house" aria-hidden="true"></i></a>
      <a href="#" aria-label="Bookings"><i class="fa-solid fa-calendar-days" aria-hidden="true"></i></a>
      <a href="#" aria-label="Likes"><i class="fa-solid fa-heart" aria-hidden="true"></i></a>
      <a href="#" aria-label="Profile"><i class="fa-solid fa-user" aria-hidden="true"></i></a>
    </nav>
  </main>
</body>
</html>
