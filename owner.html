<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owner Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body class="owner-page">
  <main class="owner-shell">
    <section class="owner-top" aria-label="Owner overview">
      <header class="owner-head">
        <h1>My Fleet</h1>
        <div class="owner-avatar" aria-label="Owner profile">CI</div>
      </header>

      <div class="owner-metrics" aria-label="Fleet metrics">
        <article class="owner-metric-card">
          <p class="owner-metric-title">Revenue</p>
          <p class="owner-metric-value"><i class="fa-solid fa-money-bill-wave" aria-hidden="true"></i> 700k</p>
        </article>
        <article class="owner-metric-card">
          <p class="owner-metric-title">Growth</p>
          <p class="owner-metric-value owner-metric-positive"><i class="fa-solid fa-arrow-trend-up" aria-hidden="true"></i> 25%</p>
        </article>
      </div>
    </section>

    <section class="owner-fleet" aria-label="Your fleet">
      <header class="fleet-head">
        <h2>Your Cars</h2>
        <button id="add-car-trigger" type="button">Add Car</button>
      </header>

      <div class="fleet-list" aria-live="polite"></div>
    </section>

    <div id="image-view-modal" class="car-modal" hidden>
      <div class="image-view-dialog" role="dialog" aria-modal="true" aria-label="Car preview">
        <button type="button" class="modal-close image-close" aria-label="Close image preview">×</button>
        <img src="" alt="Selected car preview" />
      </div>
    </div>

    <div id="car-modal" class="car-modal" hidden>
      <div class="car-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="car-modal-title">
        <div class="car-modal-header">
          <h3 id="car-modal-title">Add a car</h3>
          <button type="button" class="modal-close" aria-label="Close add car form">×</button>
        </div>

        <form id="owner-car-form" class="owner-car-form">
          <div class="upload-box">
            <label for="car-image">Main picture (front view)</label>
            <input id="car-image" name="image" type="file" accept="image/*" />
            <img id="car-image-preview" class="image-preview" alt="Selected car preview" />
          </div>

          <div class="form-grid">
            <div class="input-group">
              <label for="car-brand">Brand</label>
              <input id="car-brand" name="brand" type="text" placeholder="Toyota" required />
            </div>

            <div class="input-group">
              <label for="car-model">Model</label>
              <input id="car-model" name="model" type="text" placeholder="Rav4" required />
            </div>

            <div class="input-group">
              <label for="car-year">Year</label>
              <input id="car-year" name="year" type="number" min="2000" max="2035" placeholder="2024" required />
            </div>

            <div class="input-group">
              <label for="car-price">Price per day</label>
              <input id="car-price" name="price" type="number" min="0" step="1000" placeholder="80000" required />
            </div>

            <div class="input-group input-group-full">
              <label for="car-status">Status</label>
              <select id="car-status" name="status">
                <option value="Verified">Verified</option>
                <option value="Pending">Pending</option>
              </select>
            </div>
          </div>

          <div class="modal-actions">
            <button type="button" class="secondary-btn modal-cancel">Cancel</button>
            <button type="submit" class="submit-car">Save Car</button>
          </div>
        </form>
      </div>
    </div>

    <nav class="bottom-nav" aria-label="Primary">
      <a href="index.html" aria-label="Home"><i class="fa-solid fa-house" aria-hidden="true"></i></a>
      <a href="#" aria-label="Bookings"><i class="fa-solid fa-calendar-days" aria-hidden="true"></i></a>
      <a href="#" aria-label="Likes"><i class="fa-solid fa-heart" aria-hidden="true"></i></a>
      <a href="#" aria-label="Profile"><i class="fa-solid fa-user" aria-hidden="true"></i></a>
    </nav>
  </main>

  <script src="script.js"></script>
</body>
</html>
